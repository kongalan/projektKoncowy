---
# tasks file for roles/traefik

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
    state: present
    update_cache: true

- name: Check whether Helm is installed
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0755"
  when: helm_check.rc != 0

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
  when: helm_check.rc != 0
  changed_when: true

- name: Create Traefik namespace
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: v1
    kind: Namespace
    name: "{{ traefik_namespace }}"
    state: present

- name: Add Traefik Helm repository
  kubernetes.core.helm_repository:
    name: "{{ traefik_chart_repo_name }}"
    repo_url: "{{ traefik_chart_repo_url }}"

- name: Create Traefik values file
  ansible.builtin.template:
    src: values.yml.j2
    dest: /tmp/traefik-values.yml
    mode: "0600"

- name: Install or upgrade Traefik
  kubernetes.core.helm:
    kubeconfig: /etc/kubernetes/admin.conf
    name: "{{ traefik_release_name }}"
    chart_ref: traefik/traefik
    release_namespace: "{{ traefik_namespace }}"
    create_namespace: true
    values_files:
      - /tmp/traefik-values.yml
    state: present
    wait: true
    wait_timeout: 10m

- name: Wait for Traefik deployment
  kubernetes.core.k8s_info:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ traefik_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=traefik
  register: traefik_deployment
  retries: 30
  delay: 10
  until:
    - traefik_deployment.resources | length > 0
    - traefik_deployment.resources[0].status.availableReplicas | default(0) | int > 0