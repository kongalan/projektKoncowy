---
# tasks file for observability
- name: Install packages
  apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true

- name: Enable Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Create observability directory
  file:
    path: /opt/observability
    state: directory
    mode: '0755'

- name: Copy docker compose
  template:
    src: docker-compose.yml.j2
    dest: /opt/observability/docker-compose.yml

- name: Copy prometheus config
  template:
    src: prometheus.yml.j2
    dest: /opt/observability/prometheus.yml

- name: Copy fluent-bit config
  template:
    src: fluent-bit.conf.j2
    dest: /opt/observability/fluent-bit.conf

- name: Start stack
  community.docker.docker_compose_v2:
    project_src: /opt/observability
    state: present


- name: Create dashboard folder
  uri:
    url: "{{ grafana_url }}/api/folders"
    method: POST
    user: "{{ grafana_user }}"
    password: "{{ grafana_password }}"
    force_basic_auth: true
    body_format: json
    status_code: [200, 409, 412]
    body:
      uid: "observability"
      title: "Observability"

- name: Get dashboard JSON from grafana.com
  uri:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download"
    method: GET
    return_content: true
  loop: "{{ grafana_dashboards }}"
  register: downloaded_dashboards

- name: Import dashboards to Grafana
  uri:
    url: "{{ grafana_url }}/api/dashboards/db"
    method: POST
    user: "{{ grafana_user }}"
    password: "{{ grafana_password }}"
    force_basic_auth: true
    body_format: json
    status_code: [200, 202]
    body:
      dashboard: "{{ item.content | from_json }}"
      overwrite: true
      folderUid: "observability"
      inputs:
        - name: "DS_PROMETHEUS"
          type: "datasource"
          pluginId: "prometheus"
          value: "prometheus"
        - name: "datasource"
          type: "datasource"
          pluginId: "prometheus"
          value: "prometheus"
  loop: "{{ downloaded_dashboards.results }}"


- name: Import Starttoaster Proxmox dashboard
  uri:
    url: "{{ grafana_url }}/api/dashboards/db"
    method: POST
    user: "{{ grafana_user }}"
    password: "{{ grafana_password }}"
    force_basic_auth: true
    body_format: json
    status_code: [200, 202]
    body:
      dashboard: "{{ lookup('file', 'dashboards/starttoaster-proxmox.json') | from_json }}"
      overwrite: true
      folderUid: "observability"
      inputs:
        - name: "DS_PROMETHEUS"
          type: "datasource"
          pluginId: "prometheus"
          value: "prometheus"
        - name: "datasource"
          type: "datasource"
          pluginId: "prometheus"
          value: "prometheus"