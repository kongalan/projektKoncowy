name: Build and Deploy to Kubernetes

on:
  push:
    branches: [master]
    paths:
      - app/**
      - kubernetes/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hello-web

jobs:
  build-and-deploy:
    runs-on: [self-hosted, kubernetes-k8s]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            ./app

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/
          kubectl set image deployment/hello-web hello-web="$IMAGE_NAME:${{ github.sha }}"
          kubectl rollout status deployment/hello-web --timeout=180s
