name: Build and Deploy to Kubernetes

on:
  push:
    branches: [master]
    paths:
      - app/**
      - kubernetes/**
      - terraform/**
      - ansible-roles/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kongalan/hello-web

jobs:
  validate-terraform-ansible:
    runs-on: [self-hosted, terraform-runner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init
          terraform validate

      - name: Ansible syntax check
        working-directory: ansible-roles
        run: ansible-playbook -i inventory.ini site.yml --syntax-check
  validate-kubernetes:
    needs: validate-terraform-ansible
    runs-on: [self-hosted, terraform-runner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kubernetes manifest validation
        run: |
          kubectl apply --dry-run=client -f kubernetes/
      
      



  build-and-deploy:
    needs: validate-kubernetes
    runs-on: [self-hosted,  terraform-runner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} ./app

      - name: Push Docker image
        run: docker push $IMAGE_NAME:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/hello-web hello-web=$IMAGE_NAME:${{ github.sha }} -n default
          kubectl rollout status deployment/hello-web -n default --timeout=300s
          
      - name: Send email notification on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Deployment OK - projektKoncowy"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Deployment zakończony sukcesem.

            Repozytorium: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Deployment FAILED - projektKoncowy"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Deployment zakończył się błędem.

            Repozytorium: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            Sprawdź logi workflow w GitHub Actions.